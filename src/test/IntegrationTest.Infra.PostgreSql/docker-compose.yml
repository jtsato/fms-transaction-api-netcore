services:
  postgres:
    image: postgres:10.5
    networks:
      - xunit
    restart: always
    environment:
      POSTGRES_DB: xunit_test
      POSTGRES_USER: xunit
      POSTGRES_PASSWORD: xunit
    logging:
      options:
        max-size: 10m
        max-file: "3"
    ports:
      - "5437:5432"
    volumes:
      - ./xunit_init.sql:/docker-entrypoint-initdb.d/xunit_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xunit -d xunit_test"]
      interval: 5s
      timeout: 5s
      retries: 12

  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: always
    networks:
      - xunit
    environment:
      DB_HOST: postgres
      DB_USER: xunit
      DB_PASSWORD: xunit
      POOL_MODE: session
    ports:
      - "6437:5432"
    depends_on:
      postgres:
        condition: service_healthy

networks:
  xunit:
    driver: bridge
