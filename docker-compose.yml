services:
  local.webapi.postgresql:
    image: postgres:11.22-bullseye
    restart: always
    ports:
      - "5438:5432"
    environment:
      POSTGRES_DB: development
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    logging:
      options:
        max-size: 10m
        max-file: "3"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d development"]
      interval: 5s
      timeout: 5s
      retries: 12

  local.webapi.pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: always
    environment:
      DB_HOST: local.webapi.postgresql
      DB_USER: postgres
      DB_PASSWORD: postgres
      POOL_MODE: session
    ports:
      - "6438:5432"
    depends_on:
      local.webapi.postgresql:
        condition: service_healthy

  local.webapi:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8088:80"
    environment:
      TZ: America/Sao_Paulo
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:80
      DB_CONNECTION_STRING: Host=local.webapi.pgbouncer;Port=5432;Database=development;User Id=postgres;Password=postgres;
      TRANSACTION_TABLE_NAME: transactions
      TRANSACTION_SEQUENCE_TABLE_NAME: transactions_sequences
    depends_on:
      local.webapi.pgbouncer:
        condition: service_started

volumes:
  postgres-data:
